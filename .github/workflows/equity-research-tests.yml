name: Equity Research Skill Tests

on:
  push:
    paths:
      - 'skills/finanzas-valoracion-accion/**'
      - '.github/workflows/equity-research-tests.yml'
  pull_request:
    paths:
      - 'skills/finanzas-valoracion-accion/**'
      - '.github/workflows/equity-research-tests.yml'

jobs:
  test-equity-research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: skills/finanzas-valoracion-accion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/finanzas-valoracion-accion/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run unit and artifact tests
        run: python -m pytest -q
