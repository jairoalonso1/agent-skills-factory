name: SaaS original HTML distribution
on:
  pull_request:
  push:
    branches: [main]
jobs:
  saas-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: python3 -m pip install -r skills/fic-funds-intelligence/requirements-render.txt
      - name: Validate standalone Factory distribution
        run: python3 -m unittest discover -s skills/fic-funds-intelligence/tests -p 'test_saas_distribution.py' -v
